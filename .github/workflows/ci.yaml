name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Install the tracing engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick potrace
          # VTracer ships no distro package; the musl build is static
          curl -sL https://github.com/visioncortex/vtracer/releases/latest/download/vtracer-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar xz -C /usr/local/bin vtracer
          magick -version | head -1 || convert -version | head -1
          potrace --version | head -1
          vtracer --version

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - uses: ramsey/composer-install@v3

      # --fail-on-skipped so a missing tracing engine turns the build red
      # instead of passing with every test silently skipped.
      - run: vendor/bin/phpunit --fail-on-skipped
