name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Install the tracing engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick potrace

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - uses: ramsey/composer-install@v3

      # --fail-on-skipped so a missing tracing engine turns the build red
      # instead of passing with every test silently skipped.
      - run: vendor/bin/phpunit --fail-on-skipped
